name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: bundle 与 src 一致
        run: node scripts/build.mjs --check
      - name: userscript 头部完整
        run: |
          head -n 12 juicemind-ai-assistant.user.js
          grep -q "^// @version" juicemind-ai-assistant.user.js
          grep -q "^// @updateURL" juicemind-ai-assistant.user.js
          grep -q "^// @downloadURL" juicemind-ai-assistant.user.js
          grep -q "^// ==/UserScript==" juicemind-ai-assistant.user.js
      - name: 语法可解析
        run: node --check juicemind-ai-assistant.user.js
      - name: 单元测试（jsdom）
        run: |
          npm ci --no-audit --no-fund
          npm test
